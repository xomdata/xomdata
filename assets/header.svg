<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Tu Nguyen - Senior Analytics Engineer at GPBank" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#17386a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .tag { font-size: 14px; font-weight: 700; letter-spacing: 4px; fill: #38bdf8; }
    .name { font-size: 58px; font-weight: 800; fill: #ffffff; }
    .role { font-size: 22px; font-weight: 600; fill: #e2e8f0; }
    .quote { font-size: 16px; font-style: italic; fill: #94a3b8; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .trend { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2s ease-out .6s forwards; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.6); } }
  </style>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="620" y1="60" x2="980" y2="60"/>
    <line x1="620" y1="110" x2="980" y2="110"/>
    <line x1="620" y1="160" x2="980" y2="160"/>
    <line x1="620" y1="210" x2="980" y2="210"/>
  </g>

  <!-- text -->
  <text x="50" y="72" class="tag">DATA · ANALYTICS · BI</text>
  <text x="48" y="140" class="name">Tu Nguyen</text>
  <text x="50" y="182" class="role">Senior Analytics Engineer @ GPBank</text>
  <text x="50" y="216" class="quote">Filling in the ___ of my own data journey</text>

  <!-- animated bars -->
  <g fill="url(#bar)">
    <rect class="bar" style="animation-delay:.05s" x="640" y="180" width="28" height="40" rx="5"/>
    <rect class="bar" style="animation-delay:.15s" x="680" y="150" width="28" height="70" rx="5"/>
    <rect class="bar" style="animation-delay:.25s" x="720" y="165" width="28" height="55" rx="5"/>
    <rect class="bar" style="animation-delay:.35s" x="760" y="120" width="28" height="100" rx="5"/>
    <rect class="bar" style="animation-delay:.45s" x="800" y="135" width="28" height="85" rx="5"/>
    <rect class="bar" style="animation-delay:.55s" x="840" y="90" width="28" height="130" rx="5"/>
    <rect class="bar" style="animation-delay:.65s" x="880" y="105" width="28" height="115" rx="5"/>
    <rect class="bar" style="animation-delay:.75s" x="920" y="60" width="28" height="160" rx="5"/>
  </g>

  <!-- trend line -->
  <path class="trend" pathLength="1" d="M654 162 L694 132 L734 147 L774 102 L814 117 L854 72 L894 87 L934 42" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="934" cy="42" r="6" fill="#a3e635"/>
</svg>
