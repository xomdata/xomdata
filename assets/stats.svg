<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Career highlights" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .num { font-size: 44px; font-weight: 800; }
    .lbl { font-size: 14px; fill: #cbd5e1; }
    .card { animation: pop .6s ease-out both; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  </style>

  <g class="card" style="animation-delay:.05s">
    <rect x="0" y="0" width="232" height="150" rx="16" fill="#0b1f3a"/>
    <rect x="0" y="0" width="232" height="6" rx="3" fill="#38bdf8"/>
    <text x="116" y="78" class="num" fill="#38bdf8">15</text>
    <text x="116" y="108" class="lbl">Organizations worked with</text>
  </g>
  <g class="card" style="animation-delay:.15s">
    <rect x="256" y="0" width="232" height="150" rx="16" fill="#0b1f3a"/>
    <rect x="256" y="0" width="232" height="6" rx="3" fill="#facc15"/>
    <text x="372" y="78" class="num" fill="#facc15">5</text>
    <text x="372" y="108" class="lbl">Data certifications</text>
  </g>
  <g class="card" style="animation-delay:.25s">
    <rect x="512" y="0" width="232" height="150" rx="16" fill="#0b1f3a"/>
    <rect x="512" y="0" width="232" height="6" rx="3" fill="#a78bfa"/>
    <text x="628" y="78" class="num" fill="#a78bfa">2y 10m</text>
    <text x="628" y="108" class="lbl">Teaching data courses</text>
  </g>
  <g class="card" style="animation-delay:.35s">
    <rect x="768" y="0" width="232" height="150" rx="16" fill="#0b1f3a"/>
    <rect x="768" y="0" width="232" height="6" rx="3" fill="#4ade80"/>
    <text x="884" y="78" class="num" fill="#4ade80">2</text>
    <text x="884" y="108" class="lbl">Expert advisory networks</text>
  </g>
</svg>
