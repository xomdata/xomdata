<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Tech and skills" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #ffffff; }
    .col { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .chip-t { font-size: 15px; font-weight: 600; fill: #f1f5f9; text-anchor: middle; }
    .chip { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <rect width="1000" height="310" rx="18" fill="#0b1f3a"/>
  <text x="30" y="46" class="title">🛠️ Tech &amp; Skills</text>

  <!-- Column 1 -->
  <text x="30" y="88" class="col" fill="#38bdf8">QUERY &amp; ANALYSIS</text>
  <g class="chip" style="animation-delay:.1s"><rect x="30" y="102" width="220" height="38" rx="19" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/><text x="140" y="127" class="chip-t">SQL</text></g>
  <g class="chip" style="animation-delay:.2s"><rect x="30" y="148" width="220" height="38" rx="19" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/><text x="140" y="173" class="chip-t">Python</text></g>
  <g class="chip" style="animation-delay:.3s"><rect x="30" y="194" width="220" height="38" rx="19" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/><text x="140" y="219" class="chip-t">Data Analysis</text></g>
  <g class="chip" style="animation-delay:.4s"><rect x="30" y="240" width="220" height="38" rx="19" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/><text x="140" y="265" class="chip-t">Fraud &amp; Risk Analytics</text></g>

  <!-- Column 2 -->
  <text x="270" y="88" class="col" fill="#facc15">BI &amp; MODELING</text>
  <g class="chip" style="animation-delay:.2s"><rect x="270" y="102" width="220" height="38" rx="19" fill="#facc15" fill-opacity="0.15" stroke="#facc15"/><text x="380" y="127" class="chip-t">Power BI</text></g>
  <g class="chip" style="animation-delay:.3s"><rect x="270" y="148" width="220" height="38" rx="19" fill="#facc15" fill-opacity="0.15" stroke="#facc15"/><text x="380" y="173" class="chip-t">Data Modeling</text></g>
  <g class="chip" style="animation-delay:.4s"><rect x="270" y="194" width="220" height="38" rx="19" fill="#facc15" fill-opacity="0.15" stroke="#facc15"/><text x="380" y="219" class="chip-t">Data Marts</text></g>
  <g class="chip" style="animation-delay:.5s"><rect x="270" y="240" width="220" height="38" rx="19" fill="#facc15" fill-opacity="0.15" stroke="#facc15"/><text x="380" y="265" class="chip-t">OLAP Cubes</text></g>

  <!-- Column 3 -->
  <text x="510" y="88" class="col" fill="#a78bfa">DATA ENGINEERING</text>
  <g class="chip" style="animation-delay:.3s"><rect x="510" y="102" width="220" height="38" rx="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/><text x="620" y="127" class="chip-t">Dagster</text></g>
  <g class="chip" style="animation-delay:.4s"><rect x="510" y="148" width="220" height="38" rx="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/><text x="620" y="173" class="chip-t">Data Pipelines</text></g>
  <g class="chip" style="animation-delay:.5s"><rect x="510" y="194" width="220" height="38" rx="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/><text x="620" y="219" class="chip-t">Reporting Automation</text></g>
  <g class="chip" style="animation-delay:.6s"><rect x="510" y="240" width="220" height="38" rx="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/><text x="620" y="265" class="chip-t">Ubuntu</text></g>

  <!-- Column 4 -->
  <text x="750" y="88" class="col" fill="#4ade80">CLOUD</text>
  <g class="chip" style="animation-delay:.4s"><rect x="750" y="102" width="220" height="38" rx="19" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80"/><text x="860" y="127" class="chip-t">AWS SageMaker</text></g>
  <g class="chip" style="animation-delay:.5s"><rect x="750" y="148" width="220" height="38" rx="19" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80"/><text x="860" y="173" class="chip-t">Amazon S3</text></g>
  <g class="chip" style="animation-delay:.6s"><rect x="750" y="194" width="220" height="38" rx="19" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80"/><text x="860" y="219" class="chip-t">Google Cloud</text></g>
