<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Career timeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #ffffff; }
    .date { font-size: 13px; fill: #94a3b8; text-anchor: end; }
    .co { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .rl { font-size: 14px; fill: #cbd5e1; }
    .row { animation: slide .6s ease-out both; }
    .live { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .6; } }
  </style>

  <rect width="1000" height="540" rx="18" fill="#0b1f3a"/>
  <text x="30" y="46" class="title">💼 Career Timeline</text>

  <!-- vertical line -->
  <line x1="230" y1="84" x2="230" y2="486" stroke="#334e7a" stroke-width="3" stroke-linecap="round"/>

  <!-- 1 -->
  <g class="row" style="animation-delay:.05s">
    <text x="206" y="94" class="date">Jun 2026 – Present</text>
    <circle class="live" cx="230" cy="90" r="8" fill="#22c55e"/>
    <text x="256" y="88" class="co">GPBank</text>
    <text x="256" y="108" class="rl">Senior Analytics Engineer · Engineering Team</text>
  </g>
  <!-- 2 -->
  <g class="row" style="animation-delay:.15s">
    <text x="206" y="152" class="date">Apr 2025 – Present</text>
    <circle class="live" cx="230" cy="148" r="8" fill="#22c55e"/>
    <text x="256" y="146" class="co">Xóm Data</text>
    <text x="256" y="166" class="rl">Co-Owner · Data community</text>
  </g>
  <!-- 3 -->
  <g class="row" style="animation-delay:.25s">
    <text x="206" y="210" class="date">Feb – Jul 2026</text>
    <circle cx="230" cy="206" r="8" fill="#38bdf8"/>
    <text x="256" y="204" class="co">HV Holdings</text>
    <text x="256" y="224" class="rl">Analytics Engineer · BI ecosystem for e-commerce</text>
  </g>
  <!-- 4 -->
  <g class="row" style="animation-delay:.35s">
    <text x="206" y="268" class="date">Jan – Jul 2026</text>
    <circle cx="230" cy="264" r="8" fill="#38bdf8"/>
    <text x="256" y="262" class="co">UpBase</text>
    <text x="256" y="282" class="rl">Data Analytics Engineer · Data Marts &amp; OLAP Cubes</text>
  </g>
  <!-- 5 -->
  <g class="row" style="animation-delay:.45s">
    <text x="206" y="326" class="date">Sep 2025 – Jun 2026</text>
    <circle cx="230" cy="322" r="8" fill="#38bdf8"/>
    <text x="256" y="320" class="co">TNEX</text>
    <text x="256" y="340" class="rl">Senior Data Analyst</text>
  </g>
  <!-- 6 -->
  <g class="row" style="animation-delay:.55s">
    <text x="206" y="384" class="date">May 2023 – Feb 2026</text>
    <circle cx="230" cy="380" r="8" fill="#a78bfa"/>
    <text x="256" y="378" class="co">MindX Technology School</text>
    <text x="256" y="398" class="rl">Data Instructor &amp; Data Curriculum Designer</text>
  </g>
  <!-- 7 -->
  <g class="row" style="animation-delay:.65s">
    <text x="206" y="442" class="date">Apr 2023 – Sep 2025</text>
    <circle cx="230" cy="438" r="8" fill="#38bdf8"/>
    <text x="256" y="436" class="co">VNPAY</text>
    <text x="256" y="456" class="rl">Data Analyst · Automated reports &amp; fraud/risk warnings</text>
  </g>
  <!-- 8 -->
  <g class="row" style="animation-delay:.75s">
    <text x="206" y="500" class="date">Nov 2021 – Apr 2023</text>
    <circle cx="230" cy="496" r="8" fill="#38bdf8"/>
    <text x="256" y="494" class="co">Shopee</text>
    <text x="256" y="514" class="rl">Project Management Officer · New Sellers Flow</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#94a3b8">
    <circle cx="640" cy="40" r="6" fill="#22c55e"/><text x="654" y="44">Current</text>
    <circle cx="730" cy="40" r="6" fill="#38bdf8"/><text x="744" y="44">Data / BI</text>
    <circle cx="830" cy="40" r="6" fill="#a78bfa"/><text x="844" y="44">Teaching</text>
  </g>
</svg>
