<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="Build cool systems, robust platforms and learn new wisdoms" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#17386a"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .q { font-size: 20px; font-weight: 600; font-style: italic; fill: #e2e8f0; }
    .wave1 { animation: drift 8s linear infinite; }
    .wave2 { animation: drift 12s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-500px); } }
  </style>
  <clipPath id="clip"><rect width="1000" height="140" rx="18"/></clipPath>
  <g clip-path="url(#clip)">
    <rect width="1000" height="140" fill="url(#g)"/>
    <g class="wave2" opacity="0.35">
      <path d="M0 95 Q125 65 250 95 T500 95 T750 95 T1000 95 T1250 95 T1500 95 V140 H0 Z" fill="#38bdf8"/>
    </g>
    <g class="wave1" opacity="0.5">
      <path d="M0 110 Q125 85 250 110 T500 110 T750 110 T1000 110 T1250 110 T1500 110 V140 H0 Z" fill="#2563eb"/>
    </g>
    <text x="500" y="56" class="q">Build cool systems, robust platforms &amp; learn new wisdoms ^^</text>
  </g>
</svg>
